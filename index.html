<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chocolate Trade Desk</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --brown:#3f2416;
  --brown2:#5a321f;
  --cream:#f7f0e5;
  --card:#fffaf3;
  --line:#e7d7c3;
  --gold:#c98a2e;
  --muted:#7b6859;
  --green:#28694d;
  --red:#a33b2b;
  --blue:#315d8c;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--cream);
  color:#302118
}

button,input,select,textarea{font:inherit}

button{cursor:pointer}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at 50% 35%,#6b3d25,#321b10 65%);
  padding:20px
}

.login-card{
  width:min(430px,94vw);
  background:#fffaf5;
  border-radius:22px;
  padding:38px;
  box-shadow:0 25px 80px #0005
}

.logo{
  font-family:Georgia,serif;
  font-size:28px;
  font-weight:700
}

.sub{
  color:var(--muted);
  margin:7px 0 25px
}

.field{margin:12px 0}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:6px
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff
}

.field textarea{
  min-height:80px;
  resize:vertical
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  background:var(--brown);
  color:#fff;
  font-weight:700
}

.btn.alt{
  background:#efe1d0;
  color:var(--brown)
}

.btn.gold{background:var(--gold)}

.btn.green{background:var(--green)}

.btn.red{background:var(--red)}

.error{
  color:var(--red);
  font-size:13px;
  margin-top:10px
}

.hint{
  font-size:12px;
  color:var(--muted);
  line-height:1.5
}

.app{min-height:100vh}

.top{
  min-height:62px;
  background:var(--brown);
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 22px;
  gap:15px
}

.brand{
  font:700 21px Georgia,serif
}

.role{
  background:#d79637;
  color:#392012;
  border-radius:20px;
  padding:4px 10px;
  font-size:11px;
  font-weight:800
}

.top-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:12px
}

.top button{
  background:transparent;
  border:1px solid #ffffff55;
  color:#fff;
  border-radius:8px;
  padding:7px 11px
}

.nav{
  display:flex;
  background:#fffaf5;
  border-bottom:1px solid var(--line);
  padding:0 18px;
  gap:5px;
  overflow:auto
}

.nav button{
  border:0;
  background:none;
  padding:14px 15px;
  color:var(--muted);
  white-space:nowrap
}

.nav button.active{
  color:var(--brown);
  font-weight:800;
  border-bottom:3px solid var(--gold)
}

main{
  max-width:1400px;
  margin:auto;
  padding:24px
}

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
  gap:10px
}

.page-title h2{
  margin:0;
  font-family:Georgia,serif
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
  box-shadow:0 8px 25px #5a321f0a
}

.metric .label{
  font-size:12px;
  color:var(--muted)
}

.metric .value{
  font-size:25px;
  font-weight:800;
  margin-top:7px
}

.metric .small{
  font-size:11px;
  color:var(--muted);
  margin-top:5px
}

.section{margin-top:18px}

.section h3{
  font-family:Georgia,serif;
  margin:0 0 12px
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fffaf5
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px
}

th,td{
  text-align:left;
  padding:11px 12px;
  border-bottom:1px solid #eee1d2;
  font-size:13px
}

th{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.04em;
  background:#fbf2e7
}

tr:last-child td{border-bottom:0}

.pill{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#efe1d0;
  font-size:11px;
  font-weight:700
}

.pill.green{
  background:#dff0e5;
  color:var(--green)
}

.pill.red{
  background:#f5ded8;
  color:var(--red)
}

.pill.blue{
  background:#dce8f5;
  color:var(--blue)
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.form-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
  flex-wrap:wrap
}

.two{grid-column:span 2}

.notice{
  padding:11px 13px;
  background:#fff3d9;
  border:1px solid #eed7a8;
  border-radius:10px;
  font-size:13px;
  margin-bottom:15px
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.search{
  max-width:280px
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#302118;
  color:white;
  padding:12px 16px;
  border-radius:10px;
  box-shadow:0 10px 30px #0004;
  z-index:20
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:28px
}

.filebox{
  border:2px dashed var(--line);
  padding:16px;
  border-radius:10px;
  background:#fff
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .grid3,.formgrid{grid-template-columns:1fr}
  .two{grid-column:auto}
}

@media(max-width:600px){
  main{padding:15px}
  .grid{grid-template-columns:1fr}
  .top{padding:0 12px}
  .brand{font-size:17px}
}
</style>
</head>

<body>

<div id="root"></div>

<script>

const SUPABASE_URL =
"https://snlaqqyktcmpyxfpffhd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_H50UBB_HhklGYqi2dHIAwg_USTUM6BC";

const {createClient}=supabase;

const db=createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user=null;
let profile=null;
let active="dashboard";

let cache={
  buyers:[],
  products:[],
  bills:[],
  payments:[],
  expenses:[]
};

const root=document.getElementById("root");

const today=()=>new Date().toISOString().slice(0,10);

const money=n =>
"₹"+Number(n||0).toLocaleString(
"en-IN",
{maximumFractionDigits:2}
);

const esc=s =>
String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

function toast(message){

  const x=document.createElement("div");

  x.className="toast";

  x.textContent=message;

  document.body.appendChild(x);

  setTimeout(()=>x.remove(),2800);
}


/* =====================================================
   LOGIN
===================================================== */

async function boot(){

  const {data}=await db.auth.getSession();

  if(data.session){

    user=data.session.user;

    await loadProfile();

  }else{

    showLogin();

  }

  db.auth.onAuthStateChange(
    async(_,session)=>{

      if(session){

        user=session.user;

        await loadProfile();

      }else{

        user=null;

        profile=null;

        showLogin();

      }

    }
  );
}


async function loadProfile(){

  const {data,error}=await db
  .from("profiles")
  .select("*")
  .eq("id",user.id)
  .single();

  if(error){

    showLogin(
      "Profile not found. Please ask admin to create your profile."
    );

    return;
  }

  profile=data;

  renderApp();

  await loadAll();

}


function showLogin(msg=""){

  root.innerHTML=`

  <div class="login">

    <div class="login-card">

      <div class="logo">
        🍫 Chocolate Trade Desk
      </div>

      <div class="sub">
        Internal trading & inventory portal
      </div>

      <form id="loginForm">

        <div class="field">

          <label>Email</label>

          <input
            id="email"
            type="email"
            required
            placeholder="admin@chocolatetradedesk.com"
          >

        </div>

        <div class="field">

          <label>Password</label>

          <input
            id="password"
            type="password"
            required
            placeholder="Your password"
          >

        </div>

        <button
          class="btn"
          style="width:100%"
        >
          Sign in
        </button>

      </form>

      ${
        msg
        ?
        `<div class="error">${esc(msg)}</div>`
        :
        ""
      }

      <p class="hint" style="margin-top:18px">

        Admin sees the full dashboard.
        Staff can enter sales, purchases,
        buyers, payments and bills.

      </p>

    </div>

  </div>

  `;

  document.getElementById("loginForm").onsubmit=
  async e=>{

    e.preventDefault();

    const {error}=await db.auth.signInWithPassword({

      email:
      document.getElementById("email").value,

      password:
      document.getElementById("password").value

    });

    if(error){

      showLogin(error.message);

    }

  };

}


/* =====================================================
   APP
===================================================== */

function renderApp(){

  root.innerHTML=`

  <div class="app">

    <header class="top">

      <div class="brand">
        🍫 Chocolate Trade Desk
      </div>

      <span class="role">
        ${profile.role.toUpperCase()}
      </span>

      <div class="top-right">

        <span>
          ${esc(profile.name||profile.role)}
        </span>

        <button id="logout">
          Log out
        </button>

      </div>

    </header>

    <nav class="nav" id="nav"></nav>

    <main id="main"></main>

  </div>

  `;

  document.getElementById("logout").onclick=
  ()=>db.auth.signOut();

  renderNav();

  renderPage();

}


function renderNav(){

  let items;

  if(profile.role==="admin"){

    items=[
      ["dashboard","Dashboard"],
      ["sales","Sales"],
      ["purchases","Purchases"],
      ["payments","Payments"],
      ["parties","Parties"],
      ["products","Products"],
      ["stock","Stock"],
      ["expenses","Expenses"],
      ["ledger","Ledger"]
    ];

  }else{

    items=[
      ["dashboard","Dashboard"],
      ["sales","Enter Sale"],
      ["purchases","Enter Purchase"],
      ["payments","Payments"],
      ["parties","Buyers & Demand"],
      ["ledger","Bill Ledger"]
    ];

  }

  document.getElementById("nav").innerHTML=
  items.map(([id,label])=>`

    <button
      class="${active===id?"active":""}"
      onclick="go('${id}')"
    >
      ${label}
    </button>

  `).join("");

}


function go(page){

  active=page;

  renderNav();

  renderPage();

}


function renderPage(){

  const main=document.getElementById("main");

  if(active==="dashboard")
    return dashboardPage(main);

  if(active==="sales")
    return salesPage(main);

  if(active==="purchases")
    return purchasePage(main);

  if(active==="payments")
    return paymentsPage(main);

  if(active==="parties")
    return partiesPage(main);

  if(active==="products")
    return productsPage(main);

  if(active==="stock")
    return stockPage(main);

  if(active==="expenses")
    return expensesPage(main);

  if(active==="ledger")
    return ledgerPage(main);

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadAll(){

  const [
    buyers,
    products,
    bills,
    payments,
    expenses
  ]=await Promise.all([

    db.from("buyers")
      .select("*")
      .order("created_at",{ascending:false}),

    db.from("products")
      .select("*")
      .order("name"),

    db.from("bills")
      .select("*")
      .order("date",{ascending:false}),

    db.from("payments")
      .select("*")
      .order("date",{ascending:false}),

    db.from("expenses")
      .select("*")
      .order("date",{ascending:false})

  ]);

  cache.buyers=buyers.data||[];
  cache.products=products.data||[];
  cache.bills=bills.data||[];
  cache.payments=payments.data||[];
  cache.expenses=expenses.data||[];

  renderPage();

}


/* =====================================================
   DASHBOARD
===================================================== */

function dashboardPage(main){

  const allBills = cache.bills || [];
  const allPayments = cache.payments || [];
  const allExpenses = cache.expenses || [];
  const allProducts = cache.products || [];
  const allBuyers = cache.buyers || [];

  const dateKey = v => String(v || "").slice(0,10);

  const matchesRange = (value, range) => {
    const key = dateKey(value);
    if(!key) return false;

    const now = new Date();
    const localToday =
      `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;

    const base = new Date(`${localToday}T00:00:00`);

    if(range==="today") return key===localToday;

    if(range==="yesterday"){
      const d=new Date(base);
      d.setDate(d.getDate()-1);
      return key===`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }

    if(range==="week"){
      const start=new Date(base);
      const day=start.getDay();
      start.setDate(start.getDate()-(day===0?6:day-1));
      return new Date(`${key}T00:00:00`)>=start && new Date(`${key}T00:00:00`)<=base;
    }

    if(range==="month"){
      return key.slice(0,7)===localToday.slice(0,7);
    }

    if(range==="year"){
      return key.slice(0,4)===localToday.slice(0,4);
    }

    return true;
  };

  const selectedRange = window.dashboardRange || "today";
  window.dashboardRange = selectedRange;

  const setRange = range => {
    window.dashboardRange = range;
    dashboardPage(document.getElementById("main"));
  };

  const todayBills = allBills.filter(x=>matchesRange(x.date,"today"));
  const periodBills = allBills.filter(x=>matchesRange(x.date,selectedRange));

  const sum = (arr,field) =>
    arr.reduce((a,x)=>a+Number(x[field]||0),0);

  const salesOf = arr =>
    sum(arr.filter(x=>x.type==="sale"),"amt");

  const purchasesOf = arr =>
    sum(arr.filter(x=>x.type==="purchase"),"amt");

  const todaySales = salesOf(todayBills);
  const todayPurchases = purchasesOf(todayBills);

  const todayPayments = sum(
    allPayments.filter(x=>matchesRange(x.date,"today")),
    "amount"
  );

  const todayExpenses = sum(
    allExpenses.filter(x=>matchesRange(x.date,"today")),
    "amount"
  );

  const periodSales = salesOf(periodBills);
  const periodPurchases = purchasesOf(periodBills);

  const periodPayments = sum(
    allPayments.filter(x=>matchesRange(x.date,selectedRange)),
    "amount"
  );

  const periodExpenses = sum(
    allExpenses.filter(x=>matchesRange(x.date,selectedRange)),
    "amount"
  );

  const totalSales = salesOf(allBills);
  const totalPurchases = purchasesOf(allBills);
  const totalPayments = sum(allPayments,"amount");
  const totalExpenses = sum(allExpenses,"amount");

  const customerOutstanding =
    allBills
    .filter(x=>x.type==="sale")
    .reduce(
      (a,x)=>a+Math.max(
        0,
        Number(x.amt||0)-Number(x.paid||0)
      ),
      0
    );

  const supplierOutstanding =
    allBills
    .filter(x=>x.type==="purchase")
    .reduce(
      (a,x)=>a+Math.max(
        0,
        Number(x.amt||0)-Number(x.paid||0)
      ),
      0
    );

  // PROFIT = (SALE PRICE - PURCHASE PRICE) x SOLD QUANTITY
  // Expenses, payments and purchase bills do NOT change this profit figure.
  const productProfit = (bill) => {
    const product = allProducts.find(p =>
      String(p.name||"").trim().toLowerCase() ===
      String(bill.prod||"").trim().toLowerCase()
    );

    const purchasePrice = Number(product?.purchase_price||0);
    const salePrice = Number(product?.sale_price||0);
    const qty = Number(bill.qty||0);

    return (salePrice - purchasePrice) * qty;
  };

  const profitFor = arr =>
    arr
    .filter(x=>x.type==="sale")
    .reduce((a,x)=>a+productProfit(x),0);

  const todayProfit = profitFor(todayBills);
  const periodProfit = profitFor(periodBills);
  const totalProfit = profitFor(allBills);

  const stockValue =
    allProducts.reduce(
      (a,x)=>a+
        Number(x.stock||0)*
        Number(x.purchase_price||0),
      0
    );

  const lowStock = allProducts.filter(x =>
    Number(x.stock||0) <= Number(x.min_stock||0)
  );

  const rangeLabel = {
    today:"Today",
    yesterday:"Yesterday",
    week:"This Week",
    month:"This Month",
    year:"This Year",
    all:"All Time"
  }[selectedRange] || "Today";

  const recentBills = [...allBills]
    .sort((a,b)=>
      dateKey(b.date).localeCompare(dateKey(a.date))
    )
    .slice(0,15);

  const productSales={};

  allBills
    .filter(x=>x.type==="sale")
    .forEach(x=>{
      const name=x.prod||"Unknown";
      productSales[name]=(productSales[name]||0)+Number(x.amt||0);
    });

  const topProducts=Object.entries(productSales)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5);

  const customerSales={};

  allBills
    .filter(x=>x.type==="sale")
    .forEach(x=>{
      const name=x.party||"Unknown";
      customerSales[name]=(customerSales[name]||0)+Number(x.amt||0);
    });

  const topCustomers=Object.entries(customerSales)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5);

  const paymentReceivedToday =
    allPayments
      .filter(x=>
        matchesRange(x.date,"today") &&
        String(x.type||"").toLowerCase()==="received"
      )
      .reduce((a,x)=>a+Number(x.amount||0),0);

  const paymentPaidToday =
    allPayments
      .filter(x=>
        matchesRange(x.date,"today") &&
        String(x.type||"").toLowerCase()==="paid"
      )
      .reduce((a,x)=>a+Number(x.amount||0),0);

  const todayCashMovement =
    paymentReceivedToday -
    paymentPaidToday -
    todayExpenses;

  main.innerHTML=`

  <div class="page-title">

    <div>
      <h2>Dashboard</h2>
      <div class="hint">
        Complete business overview & daily performance
      </div>
    </div>

    <div style="
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    ">

      <select
        class="input"
        onchange="window.dashboardRange=this.value;dashboardPage(document.getElementById('main'))"
        style="min-width:145px"
      >

        <option value="today" ${selectedRange==="today"?"selected":""}>
          Today
        </option>

        <option value="yesterday" ${selectedRange==="yesterday"?"selected":""}>
          Yesterday
        </option>

        <option value="week" ${selectedRange==="week"?"selected":""}>
          This Week
        </option>

        <option value="month" ${selectedRange==="month"?"selected":""}>
          This Month
        </option>

        <option value="year" ${selectedRange==="year"?"selected":""}>
          This Year
        </option>

        <option value="all" ${selectedRange==="all"?"selected":""}>
          All Time
        </option>

      </select>

      <button
        class="btn"
        onclick="loadAll();toast('Dashboard refreshed')"
      >
        Refresh
      </button>

    </div>

  </div>


  <!-- TODAY -->

  <div class="section">

    <h3>TODAY</h3>

    <div class="grid">

      ${metric(
        "Today's Sales",
        money(todaySales),
        "Sales entered today"
      )}

      ${metric(
        "Today's Purchases",
        money(todayPurchases),
        "Purchases entered today"
      )}

      ${metric(
        "Payments Received",
        money(paymentReceivedToday),
        "Cash received today"
      )}

      ${metric(
        "Payments Paid",
        money(paymentPaidToday),
        "Cash paid today"
      )}

    </div>

    <div class="grid" style="margin-top:14px">

      ${metric(
        "Today's Expenses",
        money(todayExpenses),
        "Expenses entered today"
      )}

      ${metric(
        "Today's Profit",
        money(todayProfit),
        "(Sale Price - Purchase Price) x Quantity Sold"
      )}

      ${metric(
        "Today's Cash Movement",
        money(todayCashMovement),
        "Received - paid - expenses"
      )}

    </div>

    <div class="grid" style="margin-top:14px">

      ${metric(
        "Today's Bills",
        todayBills.length,
        "Sales + purchases"
      )}

      ${metric(
        "Today's Sales Count",
        todayBills.filter(x=>x.type==="sale").length,
        "Sales bills"
      )}

      ${metric(
        "Today's Purchase Count",
        todayBills.filter(x=>x.type==="purchase").length,
        "Purchase bills"
      )}

      ${metric(
        "Today's Activity",
        todayBills.length +
        allPayments.filter(x=>matchesRange(x.date,"today")).length +
        allExpenses.filter(x=>matchesRange(x.date,"today")).length,
        "Bills + payments + expenses"
      )}

    </div>

  </div>


  <!-- SELECTED PERIOD -->

  <div class="section">

    <h3>${rangeLabel.toUpperCase()} OVERVIEW</h3>

    <div class="grid">

      ${metric(
        rangeLabel+" Sales",
        money(periodSales),
        "Sales in selected period"
      )}

      ${metric(
        rangeLabel+" Purchases",
        money(periodPurchases),
        "Purchases in selected period"
      )}

      ${metric(
        rangeLabel+" Payments",
        money(periodPayments),
        "Payments in selected period"
      )}

async function saveSale(e){

  e.preventDefault();

  const amt=Number(saleAmt.value||0);

  let paid=Number(salePaid.value||0);

  if(salePayment.value==="cash")
    paid=amt;

  if(paid>amt){

    toast("Paid amount cannot exceed total");

    return;
  }

  const credit=amt-paid;

  const id=
  "S-"+Date.now();

  let fileUrl="";

  const file=
  document.getElementById("saleFile").files[0];

  if(file){

    fileUrl=
    await uploadBill(file,id);

    if(!fileUrl)return;

  }

  const {error}=await db
  .from("bills")
  .insert({

    id,

    type:"sale",

    no:saleNo.value,

    date:saleDate.value,

    party:saleParty.value,

    prod:saleProduct.value,

    qty:Number(saleQty.value||0),

    amt,

    paid,

    credit,

    payment_mode:salePayment.value,

    file:fileUrl,

    notes:saleNotes.value,

    created_by:user.id

  });

  if(error){

    toast(error.message);

    return;

  }

  await updateStock(
    saleProduct.value,
    -Number(saleQty.value||0)
  );

  toast("Sale saved successfully");

  await loadAll();

}

async function savePayment(e){

  e.preventDefault();

  const amount=
  Number(paymentAmount.value||0);

  if(amount<=0){

    toast("Enter a valid amount");

    return;

  }

  const id="PAY-"+Date.now();

  const {error}=await db
  .from("payments")
  .insert({

    id,

    date:paymentDate.value,

    party:paymentParty.value,

    bill_id:paymentBill.value||null,

    type:"received",

    amount,

    mode:paymentMode.value,

    notes:paymentNotes.value

  });

  if(error){

    toast(error.message);

    return;

  }

  if(paymentBill.value){

    const bill=
    cache.bills.find(
      x=>x.id===paymentBill.value
    );

    if(bill){

      const newPaid=
      Number(bill.paid||0)+amount;

      await db
      .from("bills")
      .update({

        paid:newPaid,

        credit:
        Math.max(
          0,
          Number(bill.amt||0)-newPaid
        )

      })
      .eq("id",bill.id);

    }

  }

  toast("Payment recorded");

  await loadAll();

}

function editBill(id){

  const bill=cache.bills.find(x=>x.id===id);

  if(!bill){
    toast("Bill not found");
    return;
  }

  const box=document.getElementById("billEditBox");

  if(!box)return;

  box.style.display="block";

  box.innerHTML=`

    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px">
      <h3 style="margin:0">Edit Bill — ${esc(bill.no||bill.id)}</h3>
      <button type="button" class="btn alt" onclick="closeBillEdit()">Close</button>
    </div>

    <form id="billEditForm">

      <div class="formgrid">

        ${input("Date","editBillDate",bill.date||today(),"date",true)}
        ${input("Bill Number","editBillNo",bill.no||"")}

        <div class="field">
          <label>Type</label>
          <select id="editBillType" class="input">
            <option value="sale" ${bill.type==="sale"?"selected":""}>Sale</option>
            <option value="purchase" ${bill.type==="purchase"?"selected":""}>Purchase</option>
          </select>
        </div>

        ${input("Party","editBillParty",bill.party||"","text",true)}
        ${input("Product","editBillProd",bill.prod||"","text",true)}
        ${input("Quantity","editBillQty",bill.qty||0,"number",true)}
        ${input("Bill Amount","editBillAmt",bill.amt||0,"number",true)}
        ${input("Paid","editBillPaid",bill.paid||0,"number",true)}

        <div class="field">
          <label>Payment Mode</label>
          <select id="editBillMode" class="input">
            <option value="cash" ${bill.payment_mode==="cash"?"selected":""}>Cash</option>
            <option value="bank" ${bill.payment_mode==="bank"?"selected":""}>Bank</option>
            <option value="upi" ${bill.payment_mode==="upi"?"selected":""}>UPI</option>
            <option value="credit" ${bill.payment_mode==="credit"?"selected":""}>Credit</option>
            <option value="partial" ${bill.payment_mode==="partial"?"selected":""}>Partial</option>
          </select>
        </div>

        ${input("Status","editBillStatus",bill.status||"")}
        ${input("Notes","editBillNotes",bill.notes||"")}

      </div>

      <div class="form-actions">
        <button class="btn" type="submit">Save Changes</button>
        <button class="btn alt" type="button" onclick="closeBillEdit()">Cancel</button>
      </div>

    </form>
  `;

  document.getElementById("billEditForm").onsubmit=e=>saveBillEdit(e,id);
  box.scrollIntoView({behavior:"smooth",block:"start"});
}

function closeBillEdit(){
  const box=document.getElementById("billEditBox");
  if(box){
    box.style.display="none";
    box.innerHTML="";
  }
}

async function saveBillEdit(e,id){

  e.preventDefault();

  const oldBill=cache.bills.find(x=>x.id===id);
  if(!oldBill){ toast("Bill not found"); return; }

  const amount=Number(document.getElementById("editBillAmt").value||0);
  const paid=Number(document.getElementById("editBillPaid").value||0);
  const qty=Number(document.getElementById("editBillQty").value||0);

  if(amount<0 || paid<0 || qty<0){
    toast("Amount, paid and quantity cannot be negative");
    return;
  }

  if(paid>amount){
    toast("Paid amount cannot be greater than bill amount");
    return;
  }

  const type=document.getElementById("editBillType").value;
  const newProduct=document.getElementById("editBillProd").value.trim();
  const oldProduct=oldBill.prod||"";
  const oldQty=Number(oldBill.qty||0);

  const {error}=await db
  .from("bills")
  .update({
    date:document.getElementById("editBillDate").value,
    no:document.getElementById("editBillNo").value.trim(),
    type,
    party:document.getElementById("editBillParty").value.trim(),
    prod:newProduct,
    qty,
    amt:amount,
    paid,
    credit:Math.max(0,amount-paid),
    payment_mode:document.getElementById("editBillMode").value,
    status:document.getElementById("editBillStatus").value.trim(),
    notes:document.getElementById("editBillNotes").value.trim()
  })
  .eq("id",id);

  if(error){ toast(error.message); return; }

  // Reverse old stock movement, then apply the edited movement.
  if(oldBill.type==="purchase") await updateStock(oldProduct,-oldQty);
  if(oldBill.type==="sale") await updateStock(oldProduct,oldQty);
  if(type==="purchase") await updateStock(newProduct,qty);
  if(type==="sale") await updateStock(newProduct,-qty);

  toast("Bill updated successfully");
  closeBillEdit();
  await loadAll();
}


/* =====================================================
   FILE UPLOAD
===================================================== */

async function uploadBill(file,id){

  if(file.type!=="application/pdf"){

    toast("Only PDF bills are allowed");

    return null;

  }

  const path=
  `${user.id}/${id}-${file.name}`;

  const {error}=await db.storage
  .from("bills")
  .upload(
    path,
    file,
    {
      upsert:true,
      contentType:"application/pdf"
    }
  );

  if(error){

    toast("PDF upload failed: "+error.message);

    return null;

  }

  return path;

}


async function downloadBill(path){

  if(!path){

    toast("No PDF attached");

    return;

  }

  const {data,error}=
  await db.storage
  .from("bills")
  .download(path);

  if(error){

    toast(error.message);

    return;

  }

  const url=
  URL.createObjectURL(data);

  const a=document.createElement("a");

  a.href=url;

  a.download=
  path.split("/").pop()||"bill.pdf";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}


/* =====================================================
   STOCK UPDATE
===================================================== */

async function updateStock(name,change){

  if(!name)return;

  const product=
  cache.products.find(
    x=>x.name.toLowerCase()===
    name.toLowerCase()
  );

  if(!product)return;

  await db
  .from("products")
  .update({
    stock:
    Number(product.stock||0)+change
  })
  .eq("id",product.id);

}
