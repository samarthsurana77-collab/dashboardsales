<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chocolate Trade Desk</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --brown:#3f2416;
  --brown2:#5a321f;
  --cream:#f7f0e5;
  --card:#fffaf3;
  --line:#e7d7c3;
  --gold:#c98a2e;
  --muted:#7b6859;
  --green:#28694d;
  --red:#a33b2b;
  --blue:#315d8c;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--cream);
  color:#302118
}

button,input,select,textarea{font:inherit}

button{cursor:pointer}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at 50% 35%,#6b3d25,#321b10 65%);
  padding:20px
}

.login-card{
  width:min(430px,94vw);
  background:#fffaf5;
  border-radius:22px;
  padding:38px;
  box-shadow:0 25px 80px #0005
}

.logo{
  font-family:Georgia,serif;
  font-size:28px;
  font-weight:700
}

.sub{
  color:var(--muted);
  margin:7px 0 25px
}

.field{margin:12px 0}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:6px
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff
}

.field textarea{
  min-height:80px;
  resize:vertical
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 16px;
  background:var(--brown);
  color:#fff;
  font-weight:700
}

.btn.alt{
  background:#efe1d0;
  color:var(--brown)
}

.btn.gold{background:var(--gold)}

.btn.green{background:var(--green)}

.btn.red{background:var(--red)}

.error{
  color:var(--red);
  font-size:13px;
  margin-top:10px
}

.hint{
  font-size:12px;
  color:var(--muted);
  line-height:1.5
}

.app{min-height:100vh}

.top{
  min-height:62px;
  background:var(--brown);
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 22px;
  gap:15px
}

.brand{
  font:700 21px Georgia,serif
}

.role{
  background:#d79637;
  color:#392012;
  border-radius:20px;
  padding:4px 10px;
  font-size:11px;
  font-weight:800
}

.top-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:12px
}

.top button{
  background:transparent;
  border:1px solid #ffffff55;
  color:#fff;
  border-radius:8px;
  padding:7px 11px
}

.nav{
  display:flex;
  background:#fffaf5;
  border-bottom:1px solid var(--line);
  padding:0 18px;
  gap:5px;
  overflow:auto
}

.nav button{
  border:0;
  background:none;
  padding:14px 15px;
  color:var(--muted);
  white-space:nowrap
}

.nav button.active{
  color:var(--brown);
  font-weight:800;
  border-bottom:3px solid var(--gold)
}

main{
  max-width:1400px;
  margin:auto;
  padding:24px
}

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
  gap:10px
}

.page-title h2{
  margin:0;
  font-family:Georgia,serif
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
  box-shadow:0 8px 25px #5a321f0a
}

.metric .label{
  font-size:12px;
  color:var(--muted)
}

.metric .value{
  font-size:25px;
  font-weight:800;
  margin-top:7px
}

.metric .small{
  font-size:11px;
  color:var(--muted);
  margin-top:5px
}

.section{margin-top:18px}

.section h3{
  font-family:Georgia,serif;
  margin:0 0 12px
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fffaf5
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px
}

th,td{
  text-align:left;
  padding:11px 12px;
  border-bottom:1px solid #eee1d2;
  font-size:13px
}

th{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.04em;
  background:#fbf2e7
}

tr:last-child td{border-bottom:0}

.pill{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:#efe1d0;
  font-size:11px;
  font-weight:700
}

.pill.green{
  background:#dff0e5;
  color:var(--green)
}

.pill.red{
  background:#f5ded8;
  color:var(--red)
}

.pill.blue{
  background:#dce8f5;
  color:var(--blue)
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.form-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
  flex-wrap:wrap
}

.two{grid-column:span 2}

.notice{
  padding:11px 13px;
  background:#fff3d9;
  border:1px solid #eed7a8;
  border-radius:10px;
  font-size:13px;
  margin-bottom:15px
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.search{
  max-width:280px
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#302118;
  color:white;
  padding:12px 16px;
  border-radius:10px;
  box-shadow:0 10px 30px #0004;
  z-index:20
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:28px
}

.filebox{
  border:2px dashed var(--line);
  padding:16px;
  border-radius:10px;
  background:#fff
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .grid3,.formgrid{grid-template-columns:1fr}
  .two{grid-column:auto}
}

@media(max-width:600px){
  main{padding:15px}
  .grid{grid-template-columns:1fr}
  .top{padding:0 12px}
  .brand{font-size:17px}
}
</style>
</head>

const esc=s =>
String(s??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

function toast(message){

  const x=document.createElement("div");

  x.className="toast";

  x.textContent=message;

  document.body.appendChild(x);

  setTimeout(()=>x.remove(),2800);
}


/* =====================================================
   LOGIN
===================================================== */

async function boot(){

  const {data}=await db.auth.getSession();

  if(data.session){

    user=data.session.user;

    await loadProfile();

  }else{

    showLogin();

  }

  db.auth.onAuthStateChange(
    async(_,session)=>{

      if(session){

        user=session.user;

        await loadProfile();

      }else{

        user=null;

        profile=null;

        showLogin();

      }

    }
  );
}


async function loadProfile(){

  const {data,error}=await db
  .from("profiles")
  .select("*")
  .eq("id",user.id)
  .single();

  if(error){

    showLogin(
      "Profile not found. Please ask admin to create your profile."
    );

    return;
  }

  profile=data;

  renderApp();

  await loadAll();

}

function renderApp(){

function renderNav(){

  let items;

  if(profile.role==="admin"){

    items=[
      ["dashboard","Dashboard"],
      ["sales","Sales"],
      ["purchases","Purchases"],
      ["payments","Payments"],
      ["parties","Parties"],
      ["products","Products"],
      ["stock","Stock"],
      ["expenses","Expenses"],
      ["ledger","Ledger"]
    ];

  }else{

    items=[
      ["dashboard","Dashboard"],
      ["sales","Enter Sale"],
      ["purchases","Enter Purchase"],
      ["payments","Payments"],
      ["parties","Buyers & Demand"],
      ["ledger","Bill Ledger"]
    ];

  }

  document.getElementById("nav").innerHTML=
  items.map(([id,label])=>`

    <button
      class="${active===id?"active":""}"
      onclick="go('${id}')"
    >
      ${label}
    </button>

  `).join("");

}


function go(page){

  active=page;

  renderNav();

  renderPage();

}


function renderPage(){

  const main=document.getElementById("main");

  if(active==="dashboard")
    return dashboardPage(main);

  if(active==="sales")
    return salesPage(main);

  if(active==="purchases")
    return purchasePage(main);

  if(active==="payments")
    return paymentsPage(main);

  if(active==="parties")
    return partiesPage(main);

  if(active==="products")
    return productsPage(main);

  if(active==="stock")
    return stockPage(main);

  if(active==="expenses")
    return expensesPage(main);

  if(active==="ledger")
    return ledgerPage(main);

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadAll(){

  const [
    buyers,
    products,
    bills,
    payments,
    expenses
  ]=await Promise.all([

    db.from("buyers")
      .select("*")
      .order("created_at",{ascending:false}),

    db.from("products")
      .select("*")
      .order("name"),

    db.from("bills")
      .select("*")
      .order("date",{ascending:false}),

    db.from("payments")
      .select("*")
      .order("date",{ascending:false}),

    db.from("expenses")
      .select("*")
      .order("date",{ascending:false})

  ]);

  cache.buyers=buyers.data||[];
  cache.products=products.data||[];
  cache.bills=bills.data||[];
  cache.payments=payments.data||[];
  cache.expenses=expenses.data||[];

  renderPage();

}

function dashboardPage(main){

    .filter(x=>x.type==="sale" && x.date===today())
    .reduce((a,x)=>a+Number(x.amt||0),0);

    cache.bills
    .filter(x=>x.type==="purchase" && x.date===today())
    .reduce((a,x)=>a+Number(x.amt||0),0);

  const paymentsToday=
    cache.payments
    .filter(x=>x.date===today())
    .reduce((a,x)=>a+Number(x.amount||0),0);

  const outstanding=
    cache.bills
    .filter(x=>x.type==="sale")

      0

  const stockValue=
    cache.products.reduce(
      (a,x)=>
      a+
      Number(x.stock||0)*

  main.innerHTML=`

    ${metric("Payments Today",money(paymentsToday),"Money received / paid")}

    ${metric("Outstanding",money(outstanding),"Customer credit")}

  </div>

  <div class="grid" style="margin-top:14px">

    ${metric("Stock Value",money(stockValue),"Purchase value")}

    ${metric("Products",cache.products.length,"Products in inventory")}

    ${metric("Customers",cache.buyers.length,"Buyers / parties")}

    ${metric("Bills",cache.bills.length,"Total bills")}

  </div>

  <div class="section">

    <h3>Today's Activity</h3>

    <div class="card">

      ${
        cache.bills.filter(x=>x.date===today()).length===0
        ?
        `<div class="empty">No activity today yet.</div>`
        :
        `<div class="table-wrap">

        <table>

        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Party</th>
          <th>Product</th>
          <th>Amount</th>
          <th>Payment</th>
        </tr>

        ${
          cache.bills
          .filter(x=>x.date===today())
          .slice(0,15)
          .map(billRow)
          .join("")
        }

        </table>

        </div>`
      }

    </div>

  </div>

  `;

}


function metric(label,value,small){

  return `

    <div class="label">${label}</div>

    <div class="value">${value}</div>

    <div class="small">${small}</div>

    party:purchaseParty.value,

async function savePayment(e){

  e.preventDefault();

  const amount=
  Number(paymentAmount.value||0);

  if(amount<=0){

    toast("Enter a valid amount");

    return;

  }

  const id="PAY-"+Date.now();

  const {error}=await db
  .from("payments")
  .insert({

    id,

    date:paymentDate.value,

    party:paymentParty.value,

    bill_id:paymentBill.value||null,

    type:"received",

    amount,

    mode:paymentMode.value,

    notes:paymentNotes.value

  });

  if(error){

    toast(error.message);

    return;

  }

  if(paymentBill.value){

    const bill=
    cache.bills.find(
      x=>x.id===paymentBill.value
    );

    if(bill){

      const newPaid=
      Number(bill.paid||0)+amount;

      await db
      .from("bills")
      .update({

        paid:newPaid,

        credit:
        Math.max(
          0,
          Number(bill.amt||0)-newPaid
        )

      })
      .eq("id",bill.id);

    }

  }

  toast("Payment recorded");

  await loadAll();

}

/* =====================================================
   FILE UPLOAD
===================================================== */

async function uploadBill(file,id){

  if(file.type!=="application/pdf"){

    toast("Only PDF bills are allowed");

    return null;

  }

  const path=
  `${user.id}/${id}-${file.name}`;

  const {error}=await db.storage
  .from("bills")
  .upload(
    path,
    file,
    {
      upsert:true,
      contentType:"application/pdf"
    }
  );

  if(error){

    toast("PDF upload failed: "+error.message);

    return null;

  }

  return path;

}


async function downloadBill(path){

  if(!path){

    toast("No PDF attached");

    return;

  }

  const {data,error}=
  await db.storage
  .from("bills")
  .download(path);

  if(error){

    toast(error.message);

    return;

  }

  const url=
  URL.createObjectURL(data);

  const a=document.createElement("a");

  a.href=url;

  a.download=
  path.split("/").pop()||"bill.pdf";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}

async function updateStock(name,change){

  if(!name)return;

  const product=
  cache.products.find(
    x=>x.name.toLowerCase()===
    name.toLowerCase()
  );

  if(!product)return;

  await db
  .from("products")
  .update({
    stock:
    Number(product.stock||0)+change
  })
  .eq("id",product.id);

}
