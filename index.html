/* =====================================================
   PRODUCT MASTER
   THIS IS THE ONLY SOURCE FOR PRODUCT PRICES
===================================================== */

function normalizeProductName(value){
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g," ");
}


/*
  Exact Product Master lookup.
  Product name is the key.
*/
function findProductByName(value){

  const key=
    normalizeProductName(value);

  if(!key)return null;

  return cache.products.find(
    p =>
      normalizeProductName(p.name) === key
  ) || null;
}


/*
  SALE CALCULATION

  Sale Amount =
  Sale Price \u00d7 Quantity

  Profit =
  (Sale Price - Purchase Price) \u00d7 Quantity
*/
function calculateProductProfit(
  productName,
  quantity
){

  const product=
    findProductByName(productName);

  if(!product){

    return{
      product:null,
      purchasePrice:0,
      salePrice:0,
      amount:0,
      profit:0
    };

  }

  const qty=
    Number(quantity||0);

  const purchasePrice=
    Number(product.purchase_price||0);

  const salePrice=
    Number(product.sale_price||0);

  const amount=
    salePrice*qty;

  const profit=
    (salePrice-purchasePrice)*qty;

  return{
    product,
    purchasePrice,
    salePrice,
    amount,
    profit
  };

}


/*
  PURCHASE CALCULATION

  Purchase Amount =
  Purchase Price \u00d7 Quantity
*/
function calculateProductPurchase(
  productName,
  quantity
){

  const product=
    findProductByName(productName);

  if(!product){

    return{
      product:null,
      purchasePrice:0,
      amount:0
    };

  }

  const qty=
    Number(quantity||0);

  const purchasePrice=
    Number(product.purchase_price||0);

  return{
    product,
    purchasePrice,
    amount:
      purchasePrice*qty
  };

}



/* =====================================================
   FINANCING INTEREST
   Business rule:
   - 0.75% per month
   - Interest starts on the purchase date
   - Interest stops only when sale money is actually received
   - Interest is a COST and is deducted from gross profit
===================================================== */
const FINANCING_RATE_MONTHLY = 0.0075;

function dateOnly(value){
  if(!value) return null;
  const d=new Date(String(value).slice(0,10)+"T00:00:00");
  return Number.isNaN(d.getTime()) ? null : d;
}

function daysBetween(from,to){
  const a=dateOnly(from), b=dateOnly(to);
  if(!a||!b) return 0;
  return Math.max(0, Math.round((b-a)/86400000));
}

function financingMonths(from,to){
  // 0.75% monthly, prorated by days using a 30-day month.
  return daysBetween(from,to)/30;
}

/*
  Rebuild FIFO purchase lots from the bills table so a sale can be
  tied back to the purchase date that financed its stock.
*/
function getPurchaseAllocationsForSale(targetSale, bills){
  const sorted=[...(bills||[])]
    .filter(x=>x && (x.type==="purchase" || x.type==="sale"))
    .sort((a,b)=>{
      const da=String(a.date||"");
      const db=String(b.date||"");
      if(da!==db) return da.localeCompare(db);
      return String(a.created_at||"").localeCompare(String(b.created_at||""));
    });

  const lots={};
  const targetId=targetSale && targetSale.id;
  const targetProduct=normalizeProductName(targetSale?.prod);
  let targetQty=Number(targetSale?.qty||0);
  const allocations=[];

  for(const bill of sorted){
    const key=normalizeProductName(bill.prod);
    if(!key) continue;

    if(bill.type==="purchase"){
      const qty=Number(bill.qty||0);
      if(qty>0){
        (lots[key] ||= []).push({
          qty,
          date:String(bill.date||"").slice(0,10)
        });
      }
      continue;
    }

    const saleQty=Number(bill.qty||0);
    if(saleQty<=0) continue;

    const queue=lots[key] || [];
    let remaining=saleQty;

    while(remaining>0 && queue.length){
      const lot=queue[0];
      const used=Math.min(remaining,Number(lot.qty||0));
      lot.qty-=used;
      remaining-=used;

      if(bill.id===targetId && targetQty>0 && key===targetProduct){
        const targetUsed=Math.min(used,targetQty);
        if(targetUsed>0){
          allocations.push({qty:targetUsed,purchaseDate:lot.date});
          targetQty-=targetUsed;
        }
      }

      if(lot.qty<=0) queue.shift();
    }

    /* If historical stock was entered without purchase bills, there may
       be no FIFO lot. In that case we cannot invent a financing date. */
  }

  return allocations;
}

function paymentTimelineForSale(sale, payments){
  const saleDate=String(sale?.date||"").slice(0,10);
  const saleAmount=Math.max(0,Number(sale?.amt||0));
  const directPaid=Math.min(saleAmount,Math.max(0,Number(sale?.paid||0)));

  const timeline=[];
  if(directPaid>0){
    timeline.push({date:saleDate,amount:directPaid});
  }

  const linked=(payments||[])
    .filter(p=>
      String(p.bill_id||"")===String(sale?.id||"") &&
      String(p.type||"").toLowerCase()==="received"
    )
    .sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));

  let recorded=directPaid;
  for(const p of linked){
    const amount=Math.max(0,Number(p.amount||0));
    if(amount<=0) continue;
    const usable=Math.min(amount,Math.max(0,saleAmount-recorded));
    if(usable<=0) continue;
    timeline.push({date:String(p.date||saleDate).slice(0,10),amount:usable});
    recorded+=usable;
    if(recorded>=saleAmount) break;
  }

  return {timeline,saleAmount,paid:recorded};
}

function calculateSaleFinancingInterest(sale,bills,payments){
  if(!sale || sale.type!=="sale") return 0;

  const product=findProductByName(sale.prod);
  const masterPurchasePrice=Number(product?.purchase_price||0);
  if(masterPurchasePrice<=0) return 0;

  const allocations=getPurchaseAllocationsForSale(sale,bills);
  if(!allocations.length) return 0;

  const paymentInfo=paymentTimelineForSale(sale,payments);
  const saleAmount=paymentInfo.saleAmount;
  if(saleAmount<=0) return 0;

  /*
    Every rupee of the sale represents a proportional part of the financed
    purchase cost. Interest therefore follows the amount of sale money that
    is still unpaid. The first period starts from each FIFO purchase lot's
    own purchase date; later periods start from the previous receipt date.
  */
  const totalPurchaseCost=allocations.reduce(
    (a,x)=>a+x.qty*masterPurchasePrice,
    0
  );

  if(totalPurchaseCost<=0) return 0;

  const events=[...paymentInfo.timeline];
  const received=events.reduce((a,x)=>a+Number(x.amount||0),0);

  if(received<saleAmount){
    events.push({
      date:today(),
      amount:Math.max(0,saleAmount-received)
    });
  }

  events.sort((a,b)=>String(a.date||"").localeCompare(String(b.date||"")));

  let totalInterest=0;
  let outstandingSale=saleAmount;
  let outstandingPurchaseCost=totalPurchaseCost;
  let previousDate=null;

  for(const event of events){
    const eventDate=String(event.date||today()).slice(0,10);
    if(!eventDate || outstandingSale<=0 || outstandingPurchaseCost<=0) break;

    if(!previousDate){
      /* First receipt: each purchase lot has its own financing start date. */
      totalInterest += allocations.reduce((sum,allocation)=>{
        const cost=allocation.qty*masterPurchasePrice;
        return sum + cost*FINANCING_RATE_MONTHLY*
          financingMonths(allocation.purchaseDate,eventDate);
      },0);
    }else{
      /* Later receipts: the remaining financed cost accrues from the
         previous customer receipt to this receipt. */
      totalInterest += outstandingPurchaseCost*
        FINANCING_RATE_MONTHLY*
        financingMonths(previousDate,eventDate);
    }

    const paymentAmount=Math.min(
      outstandingSale,
      Math.max(0,Number(event.amount||0))
    );

    const purchaseCostReduction=
      saleAmount>0
        ? outstandingPurchaseCost*(paymentAmount/outstandingSale)
        : outstandingPurchaseCost;

    outstandingSale=Math.max(0,outstandingSale-paymentAmount);
    outstandingPurchaseCost=Math.max(
      0,
      outstandingPurchaseCost-purchaseCostReduction
    );

    previousDate=eventDate;
  }

  return Math.max(0,totalInterest);
}

function saleNetProfit(sale,bills,payments){
  const gross=productProfitForBill(sale);
  const interest=calculateSaleFinancingInterest(sale,bills,payments);
  return gross-interest;
}

function productProfitForBill(bill){
  const result=calculateProductProfit(bill.prod,bill.qty);
  return result.profit;
}

function toast(message){

  const x=document.createElement("div");

  x.className="toast";

  x.textContent=message;

  document.body.appendChild(x);

  setTimeout(()=>x.remove(),2800);
}


/* =====================================================
   LOGIN
===================================================== */

async function boot(){

  const {data}=await db.auth.getSession();

  if(data.session){

    user=data.session.user;

    await loadProfile();

  }else{

    showLogin();

  }

  db.auth.onAuthStateChange(
    async(_,session)=>{

      if(session){

        user=session.user;

        await loadProfile();

      }else{

        user=null;

        profile=null;

        showLogin();

      }

    }
  );
}


async function loadProfile(){

  const {data,error}=await db
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .single();

  if(error){

    showLogin(
      "Profile not found. Please ask admin to create your profile."
    );

    return;
  }

  profile=data;

  active =
    profile.role === "admin"
      ? "dashboard"
      : "sales";

  renderApp();

  await loadAll();

}

/* =====================================================
   APP
===================================================== */

function renderApp(){

  root.innerHTML=`

  <div class="app">

    <header class="top">

      <div class="brand">
        \ud83c\udf6b Chocolate Trade Desk
      </div>

      <span class="role">
        ${profile.role.toUpperCase()}
      </span>

      <div class="top-right">

        <span>
          ${esc(profile.name||profile.role)}
        </span>

        <button id="logout">
          Log out
        </button>

      </div>

    </header>

    <nav class="nav" id="nav"></nav>

    <main id="main"></main>

  </div>

  `;

  document.getElementById("logout").onclick=
    ()=>db.auth.signOut();

  renderNav();

  renderPage();

}


function renderNav(){

  let items;

  if(profile.role==="admin"){

    items=[
      ["dashboard","Dashboard"],
      ["sales","Sales"],
      ["purchases","Purchases"],
      ["payments","Payments"],
      ["parties","Parties"],
      ["products","Products"],
      ["expenses","Expenses"],
      ["ledger","Ledger"]
    ];

  }else{

    items=[
      ["sales","Enter Sale"],
      ["purchases","Enter Purchase"],
      ["payments","Payments"],
      ["parties","Buyers & Demand"],
      ["ledger","Bill Ledger"]
    ];

  }

  document.getElementById("nav").innerHTML=
    items.map(
      ([id,label])=>
        `<button
          class="${active===id?"active":""}"
          onclick="go('${id}')"
        >
          ${label}
        </button>`
    ).join("");

}


function go(page){

  const adminOnly=[
    "dashboard",
    "products",
    "expenses"
  ];

  if(
    profile?.role !== "admin" &&
    adminOnly.includes(page)
  ){
    page="sales";
  }

  active=page;

  renderNav();

  renderPage();

}


function renderPage(){

  const main=
    document.getElementById("main");

  if(
    profile?.role !== "admin" &&
    active === "dashboard"
  ){

    active="sales";

    renderNav();

  }

  if(
    profile?.role !== "admin" &&
    [
      "dashboard",
      "products",
      "expenses"
    ].includes(active)
  ){

    active="sales";

    renderNav();

  }

  if(active==="dashboard")
    return dashboardPage(main);

  if(active==="sales")
    return salesPage(main);

  if(active==="purchases")
    return purchasePage(main);

  if(active==="payments")
    return paymentsPage(main);

  if(active==="parties")
    return partiesPage(main);

  if(active==="products")
    return productsPage(main);

  if(active==="expenses")
    return expensesPage(main);

  if(active==="ledger")
    return ledgerPage(main);

}


/* =====================================================
   LOAD DATA
===================================================== */

async function loadAll(){

  const [
    buyers,
    products,
    bills,
    payments,
    expenses
  ]=await Promise.all([

    db.from("buyers")
      .select("*")
      .order("created_at",{ascending:false}),

    db.from("app_products")
      .select("*")
      .order("name"),

    db.from("bills")
      .select("*")
      .order("date",{ascending:false}),

    db.from("payments")
      .select("*")
      .order("date",{ascending:false}),

    db.from("expenses")
      .select("*")
      .order("date",{ascending:false})

  ]);

  if(products.error){
    console.error("Products load failed:",products.error);
    toast("Products could not load: "+products.error.message);
  }

  cache.buyers=buyers.data||[];
  cache.products=products.data||[];
  cache.bills=bills.data||[];
  cache.payments=payments.data||[];
  cache.expenses=expenses.data||[];

  renderPage();

}


/* =====================================================
   DASHBOARD
===================================================== */

function dashboardPage(main){

  const allBills=cache.bills||[];
  const allPayments=cache.payments||[];
  const allExpenses=cache.expenses||[];
  const allProducts=cache.products||[];
  const allBuyers=cache.buyers||[];

  const dateKey=
    v=>String(v||"").slice(0,10);

        now.getMonth()+1
      ).padStart(2,"0")}-${String(
        now.getDate()
      ).padStart(2,"0")}`;

    const base=
      new Date(`${localToday}T00:00:00`);

    if(range==="today")
      return key===localToday;

    if(range==="yesterday"){

      const d=new Date(base);

      d.setDate(d.getDate()-1);

      return key===
        `${d.getFullYear()}-${String(
          d.getMonth()+1
        ).padStart(2,"0")}-${String(
          d.getDate()
        ).padStart(2,"0")}`;

    }

    if(range==="week"){

      const start=new Date(base);

      const day=start.getDay();

      start.setDate(
        start.getDate()-
        (day===0?6:day-1)
      );

      return(
        new Date(`${key}T00:00:00`)>=start &&
        new Date(`${key}T00:00:00`)<=base
      );

    }

    if(range==="month")
      return key.slice(0,7)===
        localToday.slice(0,7);

    if(range==="year")
      return key.slice(0,4)===
        localToday.slice(0,4);

    return true;

function metric(label,value,small){

  return `

  <div class="card metric">

    <div class="label">${label}</div>

    <div class="value">${value}</div>

    <div class="small">${small}</div>

  </div>

  `;

}

function toggleQuickProduct(){
  const box=document.getElementById("quickProductBox");
  if(box) box.style.display=box.style.display==="none" ? "block" : "none";
}

async function quickAddProduct(){
  const name=document.getElementById("quickProductName")?.value.trim();
  const purchase=Number(document.getElementById("quickProductPurchase")?.value||0);
  const sale=Number(document.getElementById("quickProductSale")?.value||0);

  if(!name){ toast("Enter product name"); return; }
  if(purchase<0 || sale<=0){ toast("Enter valid purchase and sale prices"); return; }

  const {error}=await db.from("app_products").insert({
    id:"PR-"+Date.now(),
    name,
    unit:"kg",
    purchase_price:purchase,
    sale_price:sale
  });

  if(error){ toast("Product add failed: "+error.message); return; }

  toast("Product added to Product Master");
  await loadAll();

  const select=document.getElementById("saleProduct");
  if(select){
    select.value=name;
    select.dispatchEvent(new Event("change"));
  }
}

async function saveSale(e){

  e.preventDefault();


  const productName=
    document.getElementById(
      "saleProduct"
    ).value.trim();

  const qty=
    Number(
      document.getElementById(
        "saleQty"
      ).value||0
    );


  if(!productName){

    toast(
      "Please select a product"
    );

    return;

  }


  if(qty<=0){

    toast(
      "Enter a valid quantity"
    );

    return;

  }


  /*
    IMPORTANT:
    Get the product AGAIN from Product Master
    at the exact moment of saving.
  */

  const result=
    calculateProductProfit(
      productName,
      qty
    );


  if(!result.product){

    toast(
      "Product not found in Product Master"
    );

    return;

  }


  const masterProduct=
    result.product;

  const masterSalePrice=
    result.salePrice;

  const masterPurchasePrice=
    result.purchasePrice;

  const amt=
    result.amount;

  const profit=
    result.profit;


  if(masterSalePrice<=0){

    toast(
      "Sale Price is missing in Product Master"
    );

    return;

  }


  if(masterPurchasePrice<0){

    toast(
      "Purchase Price is invalid in Product Master"
    );

    return;

  }


  /*
    Update display from Product Master.
  */

  document.getElementById(
    "salePrice"
  ).value=
    masterSalePrice.toFixed(2);

  document.getElementById(
    "salePurchasePrice"
  ).value=
    masterPurchasePrice.toFixed(2);

  document.getElementById(
    "saleAmt"
  ).value=
    amt.toFixed(2);

  document.getElementById(
    "saleProfit"
  ).value=
    profit.toFixed(2);


  let paid=
    Number(
      document.getElementById(
        "salePaid"
      ).value||0
    );


  const paymentMode=
    document.getElementById(
      "salePayment"
    ).value;


  if(paymentMode==="cash"){

    paid=amt;

  }


  if(paymentMode==="credit"){

    paid=0;

  }


  if(paid>amt){

    toast(
      "Paid amount cannot exceed total"
    );

    return;

  }


  const credit=
    Math.max(
      0,
      amt-paid
    );


  const status=
    credit<=0
      ? "PAID"
      : paid>0
        ? "PARTIAL"
        : "CREDIT";


  const id=
    "S-"+Date.now();


  let fileUrl="";


  const file=
    document.getElementById(
      "saleFile"
    ).files[0];


  if(file){

    fileUrl=
      await uploadBill(
        file,
        id
      );

    if(!fileUrl)return;

  }


  const {error}=
    await db
      .from("bills")
      .insert({

        id,

        type:"sale",

        no:
          document.getElementById(
            "saleNo"
          ).value,

        date:
          document.getElementById(
            "saleDate"
          ).value,

        party:
          document.getElementById(
            "saleParty"
          ).value,

        /*
          EXACT Product Master name
        */
        prod:
          masterProduct.name,

        qty,

        amt,

        paid,

        credit,

        payment_mode:
          paymentMode,

        status,

        file:fileUrl,

        notes:
          document.getElementById(
            "saleNotes"
          ).value,

        created_by:user.id

      });


  if(error){

    console.error(error);

    toast(
      "Sale save failed: "+
      error.message
    );

    return;

  }


  const savedSale={
    id,
    type:"sale",
    date:document.getElementById("saleDate").value,
    prod:masterProduct.name,
    qty,
    amt,
    paid,
    credit
  };

  const financingInterest=calculateSaleFinancingInterest(
    savedSale,
    [...cache.bills,savedSale],
    cache.payments
  );

  toast(
    `Sale saved \u2014 Gross Profit ${money(profit)} | Interest ${money(financingInterest)} | Net ${money(profit-financingInterest)}`
  );


  await loadAll();

}

async function savePayment(e){

  e.preventDefault();


  const amount=
    Number(
      document.getElementById(
        "paymentAmount"
      ).value||0
    );


  if(amount<=0){

    toast(
      "Enter a valid amount"
    );

    return;

  }


  const id=
    "PAY-"+Date.now();


  const {error}=
    await db
      .from("payments")
      .insert({

        id,

        date:
          document.getElementById(
            "paymentDate"
          ).value,

        party:
          document.getElementById(
            "paymentParty"
          ).value,

        bill_id:
          document.getElementById(
            "paymentBill"
          ).value||null,

        type:
          "received",

        amount,

        mode:
          document.getElementById(
            "paymentMode"
          ).value,

        notes:
          document.getElementById(
            "paymentNotes"
          ).value

      });


  if(error){

    toast(error.message);

    return;

  }


  const paymentBillId=
    document.getElementById(
      "paymentBill"
    ).value;


  if(paymentBillId){

    const bill=
      cache.bills.find(
        x=>x.id===paymentBillId
      );


    if(bill){

      const newPaid=
        Number(bill.paid||0)+
        amount;


      await db
        .from("bills")
        .update({

          paid:newPaid,

          credit:
            Math.max(
              0,
              Number(bill.amt||0)-
              newPaid
            ),

          status:
            Number(bill.amt||0)-
            newPaid<=0
              ? "PAID"
              : newPaid>0
                ? "PARTIAL"
                : "CREDIT"

        })
        .eq(
          "id",
          bill.id
        );

    }

  }


  toast(
    "Payment recorded"
  );

  await loadAll();

}


async function deletePayment(id){

  const payment=
    (cache.payments||[]).find(
      x=>x.id===id
    );


  if(!payment){

    toast(
      "Payment not found"
    );

    return;

  }


  const label=
    (payment.party||"")+
    ", "+
    money(payment.amount)+
    " ("+
    (payment.date||"")+
    ")";


  if(!confirm(
    "Delete this payment permanently?\n\n"+
    label+
    "\n\nThis cannot be undone."
  ))return;


  const {data:deletedRows,error}=
    await db
      .from("payments")
      .delete()
      .eq("id",id)
      .select();


  if(error){

    toast(
      "Delete failed: "+
      error.message
    );

    return;

  }


  if(!deletedRows || deletedRows.length===0){

    toast(
      "Nothing was deleted. The database blocked it (check delete permission / RLS policy on the payments table)."
    );

    return;

  }


  /*
    If this payment was recorded against a bill, put the money
    back onto that bill so its paid / credit / status stay correct.
  */

  if(payment.bill_id){

    const bill=
      (cache.bills||[]).find(
        x=>x.id===payment.bill_id
      );


    if(bill){

      const newPaid=
        Math.max(
          0,
          Number(bill.paid||0)-
          Number(payment.amount||0)
        );


      const newCredit=
        Math.max(
          0,
          Number(bill.amt||0)-
          newPaid
        );


      const newStatus=
        newCredit<=0
          ? "PAID"
          : newPaid>0
            ? "PARTIAL"
            : "CREDIT";


      await db
        .from("bills")
        .update({
          paid:newPaid,
          credit:newCredit,
          status:newStatus
        })
        .eq("id",bill.id);

    }

  }


  toast(
    "Payment deleted"
  );

  await loadAll();

}

function editProduct(id){
  const product=cache.products.find(x=>x.id===id);
  const box=document.getElementById("productEditBox");

  if(!product || !box){
    toast("Product not found");
    return;
  }

  box.style.display="block";
  box.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px">
      <h3 style="margin:0">Edit Product \u2014 ${esc(product.name)}</h3>
      <button class="btn alt" type="button" onclick="closeProductEdit()">Close</button>
    </div>

    <form id="productEditForm">
      <div class="formgrid">
        ${input("Product Name","editProductName",product.name||"","text",true)}
        ${input("Unit","editProductUnit",product.unit||"kg")}
        ${input("Purchase Price","editProductPurchase",product.purchase_price||0,"number")}
        ${input("Sale Price","editProductSale",product.sale_price||0,"number")}
      </div>

      <div class="form-actions">
        <button class="btn" type="submit">Save Changes</button>
        <button class="btn alt" type="button" onclick="closeProductEdit()">Cancel</button>
      </div>
    </form>
  `;

  document.getElementById("productEditForm").onsubmit=async e=>{
    e.preventDefault();

    const name=document.getElementById("editProductName").value.trim();
    const unit=document.getElementById("editProductUnit").value.trim()||"kg";
    const purchasePrice=Number(document.getElementById("editProductPurchase").value||0);
    const salePrice=Number(document.getElementById("editProductSale").value||0);

    if(!name){ toast("Product name is required"); return; }
    if(purchasePrice<0 || salePrice<=0){
      toast("Enter valid product values");
      return;
    }

    const duplicate=cache.products.find(x=>
      x.id!==id && normalizeProductName(x.name)===normalizeProductName(name)
    );
    if(duplicate){
      toast("A product with this name already exists");
      return;
    }

    const {error}=await db.from("app_products").update({
      name,
      unit,
      purchase_price:purchasePrice,
      sale_price:salePrice
    }).eq("id",id);

    if(error){
      toast("Product update failed: "+error.message);
      return;
    }

    toast("Product updated");
    await loadAll();
  };
}

function closeProductEdit(){
  const box=document.getElementById("productEditBox");
  if(box){
    box.style.display="none";
    box.innerHTML="";
  }
}

async function deleteProduct(id){
  const product=cache.products.find(x=>x.id===id);
  if(!product){
    toast("Product not found");
    return;
  }

  const usedInBills=cache.bills.some(x=>
    normalizeProductName(x.prod)===normalizeProductName(product.name)
  );

  const warning=usedInBills
    ? `\n\nWARNING: ${product.name} is already used in existing bills. Removing it will keep those old bills, but this product will no longer be available in Product Master for future calculations.\n\nContinue?`
    : `\n\nRemove ${product.name} from Product Master?`;

  if(!confirm(warning)) return;

  const {error}=await db.from("app_products").delete().eq("id",id);

  if(error){
    toast("Product removal failed: "+error.message);
    return;
  }

  toast("Product removed from Product Master");
  await loadAll();
}

async function saveProduct(e){

  e.preventDefault();

  const name=document.getElementById("productName").value.trim();
  const unit=document.getElementById("productUnit").value.trim()||"kg";
  const purchasePrice=Number(document.getElementById("productPurchase").value||0);
  const salePrice=Number(document.getElementById("productSale").value||0);

  if(!name){ toast("Product name is required"); return; }
  if(purchasePrice<0 || salePrice<=0){
    toast("Enter valid product values");
    return;
  }

  const duplicate=cache.products.find(x=>
    normalizeProductName(x.name)===normalizeProductName(name)
  );
  if(duplicate){
    toast("This product already exists in Product Master");
    return;
  }

  const {error}=await db.from("app_products").insert({
    id:"PR-"+Date.now(),
    name,
    unit,
    purchase_price:purchasePrice,
    sale_price:salePrice
  });

  if(error){
    toast("Product add failed: "+error.message);
    return;
  }

  toast("Product added to Product Master");
  await loadAll();
}

async function deleteBill(id){

  const bill=
    cache.bills.find(
      x=>x.id===id
    );


  if(!bill){

    toast(
      "Bill not found"
    );

    return;

  }


  const label=
    (bill.type==="sale"?"SALE":"PURCHASE")+
    " "+
    (bill.no||bill.id)+
    " ("+
    (bill.party||"")+
    ", "+
    money(bill.amt)+
    ")";


  if(!confirm(
    "Delete this bill permanently?\n\n"+
    label+
    "\n\nAny payments recorded against it will also be removed. This cannot be undone."
  ))return;


  /*
    Remove any later payments linked to this bill first,
    so no orphan payment rows are left behind.
  */

  const linkedPayments=
    (cache.payments||[]).filter(
      p=>String(p.bill_id||"")===String(id)
    );


  if(linkedPayments.length){

    const {error:payError}=
      await db
        .from("payments")
        .delete()
        .eq("bill_id",id);


    if(payError){

      toast(
        "Could not remove linked payments: "+
        payError.message
      );

      return;

    }

  }


  const {data:deletedRows,error}=
    await db
      .from("bills")
      .delete()
      .eq("id",id)
      .select();


  if(error){

    toast(
      "Delete failed: "+
      error.message
    );

    return;

  }


  if(!deletedRows || deletedRows.length===0){

    toast(
      "Nothing was deleted. The database blocked it (check delete permission / RLS policy on the bills table)."
    );

    return;

  }


  closeBillEdit();

  toast(
    "Bill deleted"
  );

  await loadAll();

}


async function saveBillEdit(e,id){

  e.preventDefault();


  const oldBill=
    cache.bills.find(
      x=>x.id===id
    );


  if(!oldBill){

    toast(
      "Bill not found"
    );

    return;

  }


  const amount=
    Number(
      document.getElementById(
        "editBillAmt"
      ).value||0
    );


  let paid=
    Number(
      document.getElementById(
        "editBillPaid"
      ).value||0
    );


  const qty=
    Number(
      document.getElementById(
        "editBillQty"
      ).value||0
    );


  if(
    amount<0 ||
    paid<0 ||
    qty<0
  ){

    toast(
      "Amount, paid and quantity cannot be negative"
    );

    return;

  }


  if(paid>amount){

    toast(
      "Paid amount cannot be greater than bill amount"
    );

    return;

  }


  const type=
    document.getElementById(
      "editBillType"
    ).value;


  const newProduct=
    document.getElementById(
      "editBillProd"
    ).value.trim();


  let fileUrl=
    oldBill.file||"";


  const editFile=
    document.getElementById(
      "editBillFile"
    )?.files?.[0];


  if(editFile){

    fileUrl=
      await uploadBill(
        editFile,
        id
      );

    if(!fileUrl)return;

  }


  let paymentMode=
    document.getElementById(
      "editBillMode"
    ).value;


  if(paymentMode==="credit"){

    paid=0;

  }else if(paymentMode==="cash"){

    paid=amount;

  }


  if(paid>amount){

    toast(
      "Paid amount cannot be greater than bill amount"
    );

    return;

  }


  const credit=
    Math.max(
      0,
      amount-paid
    );


  const status=
    credit<=0
      ? "PAID"
      : paid>0
        ? "PARTIAL"
        : "CREDIT";


  const {
    data:updatedBill,
    error
  }=
    await db
      .from("bills")
      .update({

        date:
          document.getElementById(
            "editBillDate"
          ).value,

        no:
          document.getElementById(
            "editBillNo"
          ).value.trim(),

        type,

        party:
          document.getElementById(
            "editBillParty"
          ).value.trim(),

        prod:
          newProduct,

        qty,

        amt:
          amount,

        paid,

        credit,

        payment_mode:
          paymentMode,

        status,

        notes:
          document.getElementById(
            "editBillNotes"
          ).value.trim(),

        file:
          fileUrl

      })
      .eq(
        "id",
        id
      )
      .select()
      .single();


  if(error){

    toast(
      error.message
    );

    return;

  }


  if(!updatedBill){

    toast(
      "Bill was not updated"
    );

    return;

  }


  toast(
    "Bill updated successfully"
  );


  closeBillEdit();

  await loadAll();

}


/* =====================================================
   FILE UPLOAD
===================================================== */

async function uploadBill(file,id){

  if(file.type!=="application/pdf"){

    toast(
      "Only PDF bills are allowed"
    );

    return null;

  }


  const path=
    `${user.id}/${id}-${file.name}`;


  const {error}=
    await db.storage
      .from("bills")
      .upload(
        path,
        file,
        {
          upsert:true,
          contentType:
            "application/pdf"
        }
      );


  if(error){

    toast(
      "PDF upload failed: "+
      error.message
    );

    return null;

  }


  return path;

}


async function downloadBill(path){

  if(!path){

    toast(
      "No PDF attached"
    );

    return;

  }


  const {
    data,
    error
  }=
    await db.storage
      .from("bills")
      .download(path);


  if(error){

    toast(
      error.message
    );

    return;

  }


  const url=
    URL.createObjectURL(data);


  const a=
    document.createElement("a");


  a.href=url;

  a.download=
    path.split("/").pop()||
    "bill.pdf";


  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}

      0,
      Number(x.amt||0)-
      Number(x.paid||0)
    );


  return `

  <tr>

    <td>${esc(x.date)}</td>

    <td>

      ${
        x.type==="sale"

        ?

        `<span class="pill red">
          SALE
        </span>`

        :

        `<span class="pill green">
          PURCHASE
        </span>`
      }

    </td>

    <td>
      ${esc(x.no||x.id||"")}
    </td>

    <td>
      ${esc(x.party||"")}
    </td>

    <td>
      ${esc(x.prod||"")}
    </td>

    <td>
      ${money(x.amt)}
    </td>

    <td>
      ${money(x.paid||0)}
    </td>

    <td>
      ${money(credit)}
    </td>

    <td>

      <span
        class="pill ${
          credit<=0
            ?"green"
            :"red"
        }"
      >

        ${
          credit<=0
            ?
            "PAID"
            :
            Number(x.paid||0)>0
              ?
              "PARTIAL"
              :
              "CREDIT"
        }

      </span>

    </td>

    <td>

      ${
        x.file

        ?

        `<button
          class="btn alt"
          type="button"
          onclick="
            downloadBill('${esc(x.file)}')
          "
        >
          Download PDF
        </button>`

        :

        "-"
      }

    </td>

    <td>

      <div class="actions">

        <button
          class="btn alt"
          type="button"
          onclick="
            editBill('${esc(x.id)}')
          "
        >
          Edit
        </button>

        <button
          class="btn red"
          type="button"
          onclick="
            deleteBill('${esc(x.id)}')
          "
        >
          Remove
        </button>

      </div>

    </td>

  </tr>

  `;

}


/* =====================================================
   START
===================================================== */

boot();

</script>

</body>
</html>
